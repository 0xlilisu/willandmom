<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填字母挑战 - Word Fill Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--container-bg:#fff;--text:#333;--sub:#666;
--stat-bg:#f5f5f5;--stat-color:#667eea;--border:#ddd;--missing-border:#3498db;--missing-bg:#eaf2f8;
--missing-color:#3498db;--filled-border:#27ae60;--filled-bg:#d5f5e3;--filled-color:#27ae60;
--key-left-bg:#5b9bd5;--key-left-hover:#4a8ac4;--key-right-bg:#9b59b6;--key-right-hover:#8e44ad;
--progress-bg:#eee;--progress-fill:linear-gradient(90deg,#667eea,#764ba2);
--btn-bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--btn-shadow:rgba(102,126,234,0.4);
--msg-success-bg:#d5f5e3;--msg-success-color:#27ae60;--msg-error-bg:#fadbd8;--msg-error-color:#e74c3c;
--h-shadow:0 20px 60px rgba(0,0,0,0.3);--glow:none;--particle:none;
--box-w:44px;--box-h:55px;--box-font:26px;--box-gap:6px;--key-w:42px;--key-h:42px;--key-font:16px;
--key-gap:5px;--container-pad:30px;--h1-size:28px;--stat-font:24px;--meaning-font:18px;
}
body.hell{--bg:#0a0a0a;--container-bg:#1a1a2e;--text:#ff6b6b;--sub:#f39c12;--stat-bg:#16213e;--stat-color:#e74c3c;--border:#e74c3c;--missing-border:#ff6b6b;--missing-bg:#2d132c;--missing-color:#ff6b6b;--filled-border:#f39c12;--filled-bg:#2d1b00;--filled-color:#f39c12;--key-left-bg:#c0392b;--key-left-hover:#a93226;--key-right-bg:#e67e22;--key-right-hover:#d35400;--progress-bg:#16213e;--progress-fill:linear-gradient(90deg,#ff6b6b,#ff4444,#ff6b6b);--btn-bg:linear-gradient(135deg,#e74c3c 0%,#c0392b 100%);--btn-shadow:rgba(231,76,60,0.5);--msg-success-bg:#2d1b00;--msg-success-color:#f39c12;--msg-error-bg:#2d132c;--msg-error-color:#ff4444;--h-shadow:0 0 40px rgba(255,68,68,0.3),0 20px 60px rgba(0,0,0,0.6);--glow:0 0 20px rgba(255,68,68,0.4);--particle:block}
body.mario{--bg:linear-gradient(180deg,#5c94fc 0%,#4a7de0 40%,#b8d4ff 100%);--container-bg:#fffef5;--text:#e52521;--sub:#8b4513;--stat-bg:#fff8e1;--stat-color:#e52521;--border:#e52521;--missing-border:#fbd000;--missing-bg:#fff8e1;--missing-color:#8b4513;--filled-border:#43b047;--filled-bg:#e8f5e9;--filled-color:#43b047;--key-left-bg:#e52521;--key-left-hover:#c41e1a;--key-right-bg:#43b047;--key-right-hover:#388e3c;--progress-bg:#e0e0e0;--progress-fill:linear-gradient(90deg,#fbd000,#e52521);--btn-bg:linear-gradient(135deg,#e52521 0%,#43b047 100%);--btn-shadow:rgba(229,37,33,0.4);--msg-success-bg:#c8e6c9;--msg-success-color:#2e7d32;--msg-error-bg:#ffcdd2;--msg-error-color:#c62828;--h-shadow:0 8px 0 #8b4513,0 20px 60px rgba(0,0,0,0.2);--glow:0 0 15px rgba(251,208,0,0.5);--particle:none}
body{font-family:'Segoe UI','PingFang SC',sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;transition:background .8s ease;position:relative;overflow:hidden}
.flame-particles{display:var(--particle);position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.flame{position:absolute;bottom:-10px;border-radius:50%;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0)scale(0);opacity:0}10%{opacity:.8}90%{opacity:.2}100%{transform:translateY(-100vh)scale(1.5);opacity:0}}
.game-container{background:var(--container-bg);border-radius:20px;padding:var(--container-pad);box-shadow:var(--h-shadow);max-width:650px;width:100%;position:relative;z-index:1;transition:all .5s ease}
h1{text-align:center;color:var(--text);margin-bottom:10px;font-size:var(--h1-size);transition:color .5s}
.subtitle{text-align:center;color:var(--sub);margin-bottom:20px;font-size:14px;transition:color .5s}
.stats-bar{display:flex;justify-content:space-between;background:var(--stat-bg);padding:15px 20px;border-radius:10px;margin-bottom:20px;transition:background .5s}
.stat{text-align:center}.stat-value{font-size:var(--stat-font);font-weight:bold;color:var(--stat-color)}
.stat-label{font-size:12px;color:var(--sub);margin-top:5px}
.timer.urgent{color:#ff4444;animation:pulse .4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2);text-shadow:0 0 20px #ff4444}}
.word-display{text-align:center;margin:20px 0}
.word-meaning{font-size:var(--meaning-font);font-weight:bold;margin-bottom:10px;color:var(--text)}
.word-number{color:var(--sub);font-size:13px;margin-bottom:8px}
.word-boxes{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--box-gap)}
.letter-box{width:var(--box-w);height:var(--box-h);border:3px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:var(--box-font);font-weight:bold;transition:all .3s ease;background:var(--container-bg);color:var(--text)}
.letter-box.revealed{background:var(--stat-bg);border-color:var(--stat-color)}
.letter-box.missing{border-color:var(--missing-border);background:var(--missing-bg);color:var(--missing-color);cursor:pointer;box-shadow:var(--glow);animation:missingPulse 2s ease-in-out infinite}
@keyframes missingPulse{0%,100%{box-shadow:var(--glow)}50%{box-shadow:0 0 30px rgba(255,107,107,.6)}}
.letter-box.missing:hover{transform:scale(1.1)}
.letter-box.filled{border-color:var(--filled-border);background:var(--filled-bg);color:var(--filled-color);animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.letter-box.wrong{border-color:#ff4444;background:#2d132c;color:#ff4444;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)rotate(-3deg)}30%{transform:translateX(6px)rotate(3deg)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.hint-text{text-align:center;color:var(--sub);margin:12px 0;font-size:13px}
.keyboard{display:flex;flex-direction:column;align-items:center;gap:var(--key-gap);margin-top:15px}
.keyboard-row{display:flex;justify-content:center;gap:var(--key-gap)}
.key{width:var(--key-w);height:var(--key-h);border:none;border-radius:8px;color:#fff;font-size:var(--key-font);font-weight:bold;cursor:pointer;transition:all .2s;position:relative}
.key.key-left{background:var(--key-left-bg)}.key.key-left:hover{background:var(--key-left-hover);transform:translateY(-2px)}
.key.key-right{background:var(--key-right-bg)}.key.key-right:hover{background:var(--key-right-hover);transform:translateY(-2px)}
.key:active{transform:translateY(0)scale(.95)}.key:disabled{background:#555!important;cursor:not-allowed;opacity:.4}
.key-divider{width:4px;height:var(--key-h);border-radius:2px;background:rgba(255,255,255,.2);margin:0 2px}
.key-legend{display:flex;justify-content:center;gap:20px;margin-top:8px;font-size:11px;color:var(--sub)}
.key-legend span{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend-dot.left-dot{background:var(--key-left-bg)}.legend-dot.right-dot{background:var(--key-right-bg)}
.message{text-align:center;padding:12px;border-radius:10px;margin:12px 0;font-weight:bold;opacity:0;transition:opacity .3s}
.message.show{opacity:1}.message.success{background:var(--msg-success-bg);color:var(--msg-success-color)}.message.error{background:var(--msg-error-bg);color:var(--msg-error-color)}
.btn{background:var(--btn-bg);color:#fff;border:none;padding:14px 36px;font-size:17px;border-radius:30px;cursor:pointer;transition:transform .3s,box-shadow .3s;margin:8px}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px var(--btn-shadow)}.btn-sm{padding:10px 24px;font-size:14px}
.btn-small{padding:6px 14px;font-size:12px;border-radius:15px}
.word-list{text-align:left;background:var(--stat-bg);padding:15px;border-radius:10px;margin:15px 0;max-height:180px;overflow-y:auto}
.word-item{padding:7px 0;border-bottom:1px solid rgba(128,128,128,.2);display:flex;justify-content:space-between;color:var(--sub)}.word-item:last-child{border-bottom:none}
.correct{color:#27ae60}.wrong{color:#e74c3c}
.final-score{font-size:48px;color:var(--stat-color);font-weight:bold;margin:20px 0}
.progress-bar{width:100%;height:8px;background:var(--progress-bg);border-radius:4px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:var(--progress-fill);transition:width .3s}
.screen-flash{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;animation:flashIn .5s ease-out;opacity:0}
@keyframes flashIn{0%{opacity:1}100%{opacity:0}}
.bpm-display{display:none;text-align:center;font-size:11px;color:#ff6b6b;margin-top:5px;opacity:.6}
body.hell .bpm-display{display:block}body.mario .bpm-display{display:block;color:#43b047}

/* 新屏幕：词汇选择 + 头像 + 排行榜 */
/* 词汇选择 - 网格勾选 */
.list-toolbar{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.list-toolbar .btn-sm{background:#888}
.list-toolbar .btn-sm.active-btn{background:var(--stat-color)}
.list-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:320px;overflow-y:auto;padding:4px;margin-bottom:12px}
.list-cell{padding:10px 4px;border:2px solid #ddd;border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;background:#fafafa;font-size:14px;font-weight:bold;color:var(--sub);position:relative;user-select:none}
.list-cell:hover{border-color:var(--stat-color);transform:translateY(-2px)}
.list-cell.selected{border-color:var(--stat-color);background:var(--stat-bg);color:var(--stat-color);box-shadow:0 0 8px var(--btn-shadow)}
.list-cell.selected::after{content:'✓';position:absolute;top:2px;right:4px;font-size:10px;color:var(--stat-color)}
.list-cell.empty{opacity:0.3;cursor:not-allowed;border-style:dashed}
.list-cell .list-num{font-size:14px}.list-cell .list-label{font-size:9px;margin-top:2px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-summary{text-align:center;font-size:13px;color:var(--sub);margin:8px 0}
.list-summary strong{color:var(--stat-color);font-size:16px}
@media(max-width:500px){.list-grid{grid-template-columns:repeat(5,1fr);gap:4px}.list-cell{padding:8px 2px;font-size:12px}.list-cell .list-num{font-size:12px}}
.avatar-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:300px;overflow-y:auto;padding:10px;background:var(--stat-bg);border-radius:14px;margin:15px 0}
.avatar-cell{aspect-ratio:1;border:3px solid transparent;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--container-bg)}
.avatar-cell:hover{border-color:var(--stat-color);transform:scale(1.15);z-index:1}
.avatar-cell.selected{border-color:var(--stat-color);box-shadow:0 0 15px var(--btn-shadow)}
.pixel-avatar{display:grid;grid-template-columns:repeat(8,1fr);width:100%;height:100%;padding:2px}
.pixel-cell{border-radius:1px}
.name-input{width:100%;max-width:300px;padding:12px 16px;font-size:16px;border:3px solid var(--border);border-radius:12px;text-align:center;background:var(--container-bg);color:var(--text);outline:none;transition:border-color .3s}
.name-input:focus{border-color:var(--stat-color)}
.name-hint{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
.skip-link{text-align:center;margin-top:10px;font-size:13px;color:var(--sub);cursor:pointer;text-decoration:underline}
.skip-link:hover{color:var(--stat-color)}
.leaderboard{margin:20px 0}
.lb-title{text-align:center;font-size:18px;font-weight:bold;color:var(--text);margin-bottom:12px}
.lb-table{width:100%;border-collapse:collapse}
.lb-table th,.lb-table td{padding:8px 12px;text-align:left;border-bottom:1px solid rgba(128,128,128,.2);color:var(--sub)}
.lb-table th{font-size:12px;opacity:.6;border-bottom:2px solid var(--border)}
.lb-table td{font-size:14px}
.lb-rank{font-weight:bold;color:var(--stat-color)}
.lb-avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;margin-right:8px;vertical-align:middle}
.lb-player{font-weight:bold;color:var(--text)}
.lb-score{font-weight:bold;color:var(--stat-color)}
.lb-empty{text-align:center;color:var(--sub);padding:30px;font-size:14px}
.lb-my-row{background:var(--msg-success-bg)}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);cursor:pointer;padding:6px 12px;background:var(--stat-bg);border-radius:20px;transition:all .2s}
.radio-group label:has(input:checked){background:var(--stat-color);color:#fff}
/* 难度模式卡片 */
.mode-cards{display:flex;gap:12px;margin:15px 0;justify-content:center}
.mode-card{flex:1;padding:18px 12px;border-radius:14px;border:3px solid #ddd;cursor:pointer;transition:all .2s;text-align:center;background:#fafafa;max-width:160px}
.mode-card:hover{border-color:var(--stat-color);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.mode-card.active{border-color:var(--stat-color)!important;background:var(--stat-bg);box-shadow:0 4px 15px var(--btn-shadow)}
.mode-card.normal-card{border-color:#667eea}.mode-card.normal-card:hover{border-color:#5a67d8}
.mode-card.hell-card{border-color:#e74c3c;background:#1a1a2e;color:#ff6b6b}.mode-card.hell-card:hover{border-color:#ff4444}
.mode-card.mario-card{border-color:#e52521;background:#fffef5;box-shadow:0 3px 0 #8b4513}.mode-card.mario-card:hover{border-color:#fbd000;box-shadow:0 6px 0 #8b4513,0 8px 20px rgba(229,37,33,.3)}
.mode-icon{font-size:36px;margin-bottom:6px}.mode-name{font-size:16px;font-weight:bold;margin-bottom:4px}.mode-desc{font-size:11px;opacity:.7}

/* 马里奥特殊样式 */
body.mario .game-container{border:4px solid #8b4513;border-radius:8px;box-shadow:0 8px 0 #8b4513,0 12px 30px rgba(0,0,0,.2)}
body.mario .letter-box{border-radius:4px;font-family:'Courier New',monospace}
body.mario .letter-box.missing{background:#fbd000;border-color:#8b4513;color:#8b4513;animation:marioBounce .6s ease-in-out infinite}
@keyframes marioBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}50%{transform:translateY(0)}70%{transform:translateY(-3px)}}
body.mario .key{border-radius:4px;font-family:'Courier New',monospace;box-shadow:0 3px 0 rgba(0,0,0,.3)}
body.mario .key:hover{box-shadow:0 5px 0 rgba(0,0,0,.3)}
body.mario .key:active{box-shadow:0 1px 0 rgba(0,0,0,.3);transform:translateY(2px)scale(.95)}
body.mario .btn{border-radius:4px;box-shadow:0 4px 0 #8b4513}
body.mario .btn:hover{box-shadow:0 6px 0 #8b4513}.body.mario .btn:active{box-shadow:0 2px 0 #8b4513;transform:translateY(2px)}
body.mario .stats-bar{border:2px solid #fbd000;border-radius:4px}
.coin-spin{position:fixed;pointer-events:none;z-index:999;font-size:32px;animation:coinFly .8s ease-out forwards}
@keyframes coinFly{0%{opacity:1;transform:translateY(0)scale(.5)}30%{opacity:1;transform:translateY(-40px)scale(1.2)}100%{opacity:0;transform:translateY(-80px)scale(1)}}

/* 手机响应式 */
@media(max-width:500px){:root{--box-w:34px;--box-h:44px;--box-font:20px;--box-gap:4px;--key-w:32px;--key-h:38px;--key-font:14px;--key-gap:3px;--container-pad:15px;--h1-size:22px;--stat-font:18px;--meaning-font:15px}
.game-container{border-radius:14px}.letter-box{border-width:2px;border-radius:7px}.stats-bar{padding:10px 12px;border-radius:8px;margin-bottom:14px}
.stat-label{font-size:10px}.subtitle{font-size:12px;margin-bottom:14px}.hint-text{font-size:11px;margin:8px 0}
.btn{padding:10px 24px;font-size:14px;margin:5px}.btn-sm{padding:8px 16px;font-size:12px}
.word-number{font-size:11px}.key-divider{width:3px;margin:0 1px}
.final-score{font-size:36px;margin:14px 0}.word-list{max-height:140px;padding:10px}.word-item{font-size:12px;padding:5px 0}
.avatar-grid{grid-template-columns:repeat(8,1fr);max-height:220px}.message{padding:8px;font-size:13px}
.name-input{font-size:14px;padding:10px 14px}}
@media(max-width:380px){:root{--box-w:28px;--box-h:38px;--box-font:17px;--box-gap:3px;--key-w:28px;--key-h:34px;--key-font:13px;--key-gap:2px;--container-pad:10px;--h1-size:19px;--stat-font:16px;--meaning-font:13px}
.letter-box{border-width:2px;border-radius:5px}.key{border-radius:5px}.stats-bar{padding:8px 10px;border-radius:6px;margin-bottom:10px}
.hint-text{font-size:10px}.btn{padding:8px 18px;font-size:12px}.btn-sm{padding:6px 12px;font-size:11px}
.final-score{font-size:30px}.word-list{max-height:120px}
.avatar-grid{grid-template-columns:repeat(6,1fr);max-height:180px}}</style></head>
<body>
<div class="flame-particles" id="flameParticles"></div>
<div class="game-container">
<!-- 词汇表+模式选择 -->
<div id="vocabScreen"><h1>🎮 填字母挑战</h1><p class="subtitle" id="vocabSubtitle">勾选章节，点击难度卡片开始</p>
<div class="list-toolbar"><button class="btn btn-sm active-btn" onclick="selectAllLists()">全选</button><button class="btn btn-sm" onclick="deselectAllLists()">取消</button><button class="btn btn-sm" onclick="invertSelection()">反选</button></div>
<div class="list-grid" id="listGrid"></div>
<div class="list-summary" id="listSummary"></div>
<div style="text-align:center;margin:15px 0"><p style="color:var(--sub);font-size:13px;margin-bottom:10px">点击卡片选择模式开始 →</p>
<div class="mode-cards"><div class="mode-card normal-card" onclick="selectModeCard('normal',this)"><div class="mode-icon">📖</div><div class="mode-name">普通模式</div><div class="mode-desc">120秒  +10/-5</div></div><div class="mode-card hell-card" onclick="selectModeCard('hell',this)"><div class="mode-icon">🔥</div><div class="mode-name">地狱模式</div><div class="mode-desc">90秒  +20/-15</div></div><div class="mode-card mario-card" onclick="selectModeCard('mario',this)"><div class="mode-icon">🍄</div><div class="mode-name">快枪手</div><div class="mode-desc">60秒  +15/-10</div></div></div></div>
<div style="text-align:center;margin-top:8px"><span class="skip-link" onclick="goToPlayerSetup()">👤 修改头像和昵称</span></div></div>

<!-- 玩家设置 -->
<div id="playerScreen" style="display:none"><h1>👤 你的身份</h1><p class="subtitle">选头像和昵称（可以跳过）</p>
<div style="text-align:center;margin:15px 0"><div id="previewAvatar" style="display:inline-block;width:64px;height:64px;border:3px solid var(--border);border-radius:12px;overflow:hidden"></div></div>
<p style="text-align:center;font-size:13px;color:var(--sub);margin-bottom:8px">选一个头像吧 🎨</p>
<div class="avatar-grid" id="avatarGrid"></div>
<p style="text-align:center;font-size:13px;color:var(--sub);margin:12px 0">你的昵称（可选）</p>
<div style="text-align:center"><input type="text" class="name-input" id="playerName" placeholder="输入你的名字..." maxlength="12"></div>
<div class="name-hint">留空则不参与排行榜</div>
<div style="text-align:center;margin-top:15px"><button class="btn" onclick="startGame()">🎮 开始游戏</button><br><span class="skip-link" onclick="showVocabScreen()">← 返回选择</span></div></div>

<!-- 游戏界面 -->
<div id="gameScreen" style="display:none"><h1 id="gameTitle">填字母挑战</h1>
<div class="stats-bar"><div class="stat"><div class="stat-value" id="score">0</div><div class="stat-label">得分</div></div><div class="stat"><div class="stat-value" id="wordCount">1/10</div><div class="stat-label">进度</div></div><div class="stat"><div class="stat-value" id="timer">120</div><div class="stat-label">剩余时间</div></div></div>
<div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:10%"></div></div><div class="bpm-display" id="bpmDisplay">BPM: --</div>
<div class="word-display"><div class="word-meaning" id="wordMeaning"></div><div class="word-number">单词 <span id="currentNum">1</span>/<span id="totalWords">10</span></div><div class="word-boxes" id="wordBoxes"></div></div>
<p class="hint-text" id="hintText">💡 点击空格或按键盘输入缺失的字母</p><div id="message" class="message"></div>

// === LOCAL STORAGE ===
const LS_KEY = 'wordfill_player';
function loadPlayer() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || { name: '', avatar: 0 }; } catch (e) { return { name: '', avatar: 0 }; } }

function loadLB(mode, listId) { const k = 'wordfill_lb_' + mode + '_' + listId; try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }
function saveLB(mode, listId, entries) {
  const k = 'wordfill_lb_' + mode + '_' + listId;
  const dedup = new Map();
  entries.forEach(e => { const ex = dedup.get(e.name); if (!ex || e.score > ex.score) dedup.set(e.name, e); });
  const arr = Array.from(dedup.values()).sort((a, b) => b.score - a.score).slice(0, 10);
  localStorage.setItem(k, JSON.stringify(arr));
  return arr;
}
function addToLB(mode, listId, entry) { const lb = loadLB(mode, listId); lb.push(entry); return saveLB(mode, listId, lb); }

// === GAME STATE ===
let gameMode = 'normal', selectedListIds = new Set(WORD_LISTS.filter(w => w.words.length > 0).map(w => w.id)), words = [], playerData = loadPlayer();
let currentWordIndex = 0, score = 0, timeLeft, timerInterval, currentWord = null, missingIndices = [], filledIndices = new Set(), gameResults = [];
let audioCtx = null, bgmInterval = null, bgmGain = null, currentBPM = 120, marioN = 0;

// === VOCAB SELECTION UI ===
function showVocabScreen() {
  stopBGM(); clearInterval(timerInterval);
  document.body.className = '';
  document.getElementById('flameParticles').innerHTML = '';
  ['vocabScreen', 'playerScreen', 'gameScreen', 'endScreen'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('vocabScreen').style.display = 'block';
  renderListGrid();
  updateSummary();
}
function toggleList(id) { if (selectedListIds.has(id)) selectedListIds.delete(id); else selectedListIds.add(id); renderListGrid(); updateSummary(); }
function selectAllLists() { WORD_LISTS.filter(w => w.words.length > 0).forEach(w => selectedListIds.add(w.id)); renderListGrid(); updateSummary(); }

function invertSelection() { WORD_LISTS.filter(w => w.words.length > 0).forEach(w => { if (selectedListIds.has(w.id)) selectedListIds.delete(w.id); else selectedListIds.add(w.id); }); renderListGrid(); updateSummary(); }
function renderListGrid() {
  const g = document.getElementById('listGrid');
  g.innerHTML = WORD_LISTS.map(wl => {
    const has = wl.words.length > 0, sel = selectedListIds.has(wl.id);
    return '<div class="list-cell' + (sel ? ' selected' : '') + (has ? '' : ' empty') + '" onclick="' + (has ? "toggleList('" + wl.id + "')" : '') + '" title="' + (has ? (wl.label || 'List ' + wl.num) : 'coming soon') + '"><div class="list-num">' + wl.num + '</div>' + (wl.label ? '<div class="list-label">' + wl.label + '</div>' : '') + '</div>';
  }).join('');
}
function updateSummary() {
  let total = 0; selectedListIds.forEach(id => { const w = WORD_LISTS.find(wl => wl.id === id); if (w) total += w.words.length; });
  document.getElementById('listSummary').innerHTML = '\u5df2\u9009 <strong>' + selectedListIds.size + '</strong> \u4e2a\u7ae0\u8282\uff0c\u5171 <strong>' + total + '</strong> \u4e2a\u5355\u8bcd';
  document.querySelector('#vocabScreen .btn') && (document.querySelector('#vocabScreen .btn').disabled = total === 0);
}

// === MODE CARD ===
function selectModeCard(mode, el) {
  gameMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  startGame();
}

// === PLAYER SETUP ===
function goToPlayerSetup() {
  document.getElementById('vocabScreen').style.display = 'none';
  document.getElementById('playerScreen').style.display = 'block';
  document.getElementById('playerName').value = playerData.name || '';
  renderAvatarGrid();
  updatePreview();
}
function updatePreview() { const av = ALL_AVATARS[playerData.avatar]; renderPixelAvatar(document.getElementById('previewAvatar'), av, 60); }
function renderAvatarGrid() {
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = '';

document.getElementById('playerName').addEventListener('input', function () { playerData.name = this.value.trim(); });

// === KEYBOARD ===
const leftHandKeys = new Set(['Q', 'W', 'E', 'R', 'T', 'A', 'S', 'D', 'F', 'G', 'Z', 'X', 'C', 'V', 'B']);
const rightHandKeys = new Set(['Y', 'U', 'I', 'O', 'P', 'H', 'J', 'K', 'L', 'N', 'M']);
function generateKeyboard() {
  const kb = document.getElementById('keyboard'); kb.innerHTML = '';
  [['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'], ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'], ['Z', 'X', 'C', 'V', 'B', 'N', 'M']].forEach(row => {
    const rd = document.createElement('div'); rd.className = 'keyboard-row';
    row.forEach(letter => {
      if ((row[0] === 'Q' && letter === 'Y') || (row[0] === 'A' && letter === 'H') || (row[0] === 'Z' && letter === 'N')) { const d = document.createElement('div'); d.className = 'key-divider'; rd.appendChild(d); }
      const btn = document.createElement('button');
      btn.className = 'key ' + (leftHandKeys.has(letter) ? 'key-left' : 'key-right');
      btn.textContent = letter;
      btn.onclick = function () { handleInput(letter); };
      rd.appendChild(btn);
    });
    kb.appendChild(rd);
  });
}

// === AUDIO ===
function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); bgmGain = audioCtx.createGain(); bgmGain.gain.value = 0.12; bgmGain.connect(audioCtx.destination); } if (audioCtx.state === 'suspended') audioCtx.resume(); }
function note(freq, type, start, dur, vol, gainNode) { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, start); g.gain.setValueAtTime(vol, start); g.gain.exponentialRampToValueAtTime(0.01, start + dur); o.connect(g); g.connect(gainNode || audioCtx.destination); o.start(start); o.stop(start + dur); }
function playCorrectSound() { if (!audioCtx) return; const n = audioCtx.currentTime; if (gameMode === 'mario') { [988, 1319].forEach((f, i) => note(f, 'square', n + i * 0.07, 0.12, 0.12, null)); return; } note(880, 'sine', n, 0.3, 0.3, null); note(1320, 'sine', n + 0.06, 0.4, 0.2, null); }
function playWrongSound() { if (!audioCtx) return; const n = audioCtx.currentTime; if (gameMode === 'mario') { note(200, 'triangle', n, 0.25, 0.15, null); return; } const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(150, n); o.frequency.setValueAtTime(100, n + 0.15); g.gain.setValueAtTime(0.15, n); g.gain.exponentialRampToValueAtTime(0.01, n + 0.4); o.connect(g); g.connect(audioCtx.destination); o.start(n); o.stop(n + 0.4); }
function playWordComplete() { if (!audioCtx) return; const n = audioCtx.currentTime; if (gameMode === 'mario') { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => note(f, 'square', n + i * 0.05, 0.1, 0.1, null)); return; } [523, 659, 784, 1047].forEach((f, i) => note(f, 'sine', n + i * 0.1, 0.25, 0.2, null)); }
function playGameOver() { if (!audioCtx) return; const n = audioCtx.currentTime; if (gameMode === 'mario') { [659, 587, 523, 392, 330, 262].forEach((f, i) => note(f, 'square', n + i * 0.12, 0.2, 0.12, null)); return; } [440, 415, 392, 349, 330].forEach((f, i) => note(f, 'triangle', n + i * 0.2, 0.35, 0.25, null)); }

// === BGM ===
function startBGM(total) { stopBGM(); if (!audioCtx) return; if (gameMode === 'mario') { startMarioBGM(); return; } currentBPM = total <= 90 ? 100 : 80; bgmInterval = setInterval(function () { if (!audioCtx || audioCtx.state === 'suspended') return; const n = audioCtx.currentTime, tot = gameMode === 'hell' ? 90 : 120, r = (tot - timeLeft) / tot; currentBPM = (tot <= 90 ? 100 : 80) + r * ((tot <= 90 ? 220 : 180) - (tot <= 90 ? 100 : 80)); document.getElementById('bpmDisplay').textContent = '\ud83d\udd25 BPM: ' + Math.round(currentBPM); note(55, 'sine', n, 0.15, 0.3, bgmGain); const ns = audioCtx.createBufferSource(), bs = audioCtx.sampleRate * 0.05, b = audioCtx.createBuffer(1, bs, audioCtx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < bs; i++)d[i] = Math.random() * 2 - 1; ns.buffer = b; const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000; const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.08, n); g2.gain.exponentialRampToValueAtTime(0.01, n + 0.05); ns.connect(f); f.connect(g2); g2.connect(bgmGain); ns.start(n); ns.stop(n + 0.05); }, function () { return 60000 / currentBPM; }); }
function startMarioBGM() { const mel = [523, 659, 784, 1047, 784, 1047, 1319, 1047, 784, 659, 523, 659, 523, 392, 523]; currentBPM = 140; marioN = 0; bgmInterval = setInterval(function () { if (!audioCtx || audioCtx.state === 'suspended') return; const n = audioCtx.currentTime, r = (60 - timeLeft) / 60; currentBPM = 140 + r * 80; document.getElementById('bpmDisplay').textContent = '\ud83c\udf44 BPM: ' + Math.round(currentBPM); note(mel[marioN % mel.length], 'square', n, 0.1, 0.06, bgmGain); marioN++; if (marioN % 4 === 0) note(80, 'sine', n, 0.12, 0.2, bgmGain); if (marioN % 8 === 0) note(1568, 'sine', n, 0.08, 0.05, bgmGain); }, function () { return 60000 / currentBPM; }); }
function updateBGM() { if (!bgmInterval || gameMode === 'mario') return; const tot = gameMode === 'hell' ? 90 : 120, r = (tot - timeLeft) / tot; currentBPM = (tot <= 90 ? 100 : 80) + r * ((tot <= 90 ? 220 : 180) - (tot <= 90 ? 100 : 80)); }
function stopBGM() { if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; } document.getElementById('bpmDisplay').textContent = 'BPM: --'; }

// === FLAME PARTICLES ===
function createFlameParticles() { const c = document.getElementById('flameParticles'); c.innerHTML = ''; for (let i = 0; i < 30; i++) { const f = document.createElement('div'); f.className = 'flame'; const s = Math.random() * 4 + 2; f.style.width = s + 'px'; f.style.height = s + 'px'; f.style.left = Math.random() * 100 + '%'; f.style.background = Math.random() > 0.5 ? 'hsl(' + (Math.random() * 30 + 10) + ',100%,' + (Math.random() * 30 + 40) + '%)' : 'hsl(' + (Math.random() * 15) + ',100%,' + (Math.random() * 20 + 50) + '%)'; f.style.animationDuration = (Math.random() * 4 + 3) + 's'; f.style.animationDelay = Math.random() * 4 + 's'; c.appendChild(f); } }
function applyMode(mode) { gameMode = mode; document.body.className = ''; document.getElementById('flameParticles').innerHTML = ''; if (mode === 'hell') { document.body.classList.add('hell'); createFlameParticles(); } else if (mode === 'mario') document.body.classList.add('mario'); }

// === GAME ENGINE ===
function startGame() {
  if (!gameMode) gameMode = 'normal';
  applyMode(gameMode);
  savePlayer(playerData);
  words = []; selectedListIds.forEach(id => { const wl = WORD_LISTS.find(w => w.id === id); if (wl) words.push.apply(words, wl.words); });
  if (words.length === 0) return;
  ['vocabScreen', 'playerScreen', 'gameScreen', 'endScreen'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('gameScreen').style.display = 'block';
  currentWordIndex = 0; score = 0; timeLeft = gameMode === 'hell' ? 90 : (gameMode === 'mario' ? 60 : 120); gameResults = [];
  var titles = { hell: '\ud83d\udd25 Hell Mode', mario: '\ud83c\udf44 Quick Draw', normal: '\ud83d\udcd6 Word Fill' };
  document.getElementById('gameTitle').textContent = titles[gameMode];
  var hints = { hell: '\ud83d\udc80 Read Chinese meaning! Type to fill.', mario: '\ud83c\udf44 Collect coins! Type to fill.', normal: '\ud83d\udca1 Click blanks or type to fill.' };
  document.getElementById('hintText').textContent = hints[gameMode];
  document.getElementById('totalWords').textContent = words.length;
  updateScore(); updateTimer(); generateKeyboard(); loadWord(); startTimer();
  if (gameMode === 'hell') startBGM(90); else if (gameMode === 'mario') startBGM(60);
  initAudio();
}

function loadWord() {
  if (currentWordIndex >= words.length) { endGame(); return; }
  currentWord = words[currentWordIndex]; var w = currentWord.word, wl = w.length;
  missingIndices = []; filledIndices.clear();
  if (gameMode === 'hell') {
    var nr = wl <= 6 ? 1 : 2, ai = Array.from({ length: wl }, function (_, i) { return i; });
    for (var i = ai.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var _a = [ai[j], ai[i]]; ai[i] = _a[0]; ai[j] = _a[1]; }
    var ri = new Set(ai.slice(0, nr));
    for (var i = 0; i < wl; i++) { if (!ri.has(i)) missingIndices.push(i); }
  } else {
    var nh = Math.max(2, Math.floor(wl * 0.4)), ai = Array.from({ length: wl }, function (_, i) { return i; });
    for (var i = ai.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var _a = [ai[j], ai[i]]; ai[i] = _a[0]; ai[j] = _a[1]; }
    missingIndices = ai.slice(0, nh).sort(function (a, b) { return a - b; });
  }
  renderWord(); updateProgress();
}

function renderWord() {
  var c = document.getElementById('wordBoxes'); c.innerHTML = ''; var w = currentWord.word;
  for (var i = 0; i < w.length; i++) {
    var b = document.createElement('div'); b.className = 'letter-box';
    if (missingIndices.includes(i)) {
      if (filledIndices.has(i)) { b.classList.add('filled'); b.textContent = w[i]; }
      else { b.classList.add('missing'); b.textContent = '?'; }
    } else { b.classList.add('revealed'); b.textContent = w[i]; }
    c.appendChild(b);
  }
  document.getElementById('currentNum').textContent = currentWordIndex + 1;
  document.getElementById('wordMeaning').innerHTML = gameMode === 'hell' ? '<span style="opacity:0.6;font-size:13px">\ud83d\udd0d Meaning: </span>' + currentWord.meaning : '';
}

function handleInput(letter) {
  if (!currentWord || timeLeft <= 0) return;
  var ti = -1;
  for (var _i = 0, missingIndices_1 = missingIndices; _i < missingIndices_1.length; _i++) { var idx = missingIndices_1[_i]; if (!filledIndices.has(idx)) { ti = idx; break; } }
  if (ti === -1) return;
  var cl = currentWord.word[ti];
  if (letter === cl) {
    filledIndices.add(ti);
    var pts = gameMode === 'hell' ? 20 : (gameMode === 'mario' ? 15 : 10);
    score += pts; playCorrectSound();
    showMsg('\u2705 Correct! +' + pts, 'success');
    renderWord(); updateScore();
    if (gameMode === 'mario') spawnCoin(ti);
    if (filledIndices.size === missingIndices.length) {
      gameResults.push({ word: currentWord.word, meaning: currentWord.meaning, correct: true });
      playWordComplete();
      setTimeout(function () { currentWordIndex++; loadWord(); }, 600);
    }
  } else {
    var pen = gameMode === 'hell' ? 15 : (gameMode === 'mario' ? 10 : 5);
    score -= pen; playWrongSound();
    showMsg('\u274c Wrong! Answer is ' + cl + ', -' + pen, 'error');
    updateScore();
    document.querySelectorAll('.letter-box.missing').forEach(function (b) { if (b.textContent === '?') { b.classList.add('wrong'); setTimeout(function () { b.classList.remove('wrong'); }, 400); } });
    if (gameMode === 'hell') {
      document.body.style.transform = 'translateX(4px)'; setTimeout(function () { document.body.style.transform = 'translateX(-3px)'; }, 50); setTimeout(function () { document.body.style.transform = 'translateX(2px)'; }, 100); setTimeout(function () { document.body.style.transform = 'translateX(0)'; }, 150);
    } else if (gameMode === 'mario') {
      var g2 = document.querySelector('.game-container'); g2.style.transform = 'translateY(-5px)'; setTimeout(function () { g2.style.transform = 'translateY(0)'; }, 100); setTimeout(function () { g2.style.transform = 'translateY(-3px)'; }, 200); setTimeout(function () { g2.style.transform = 'translateY(0)'; }, 300);
    }
  }
}

function showMsg(t, type) { var m = document.getElementById('message'); m.textContent = t; m.className = 'message show ' + type; setTimeout(function () { m.classList.remove('show'); }, 1500); }
function getListKey() { var ids = Array.from(selectedListIds).sort(); return ids.length === WORD_LISTS.filter(function (w) { return w.words.length > 0; }).length ? 'all' : ids.join('_'); }
function updateScore() { document.getElementById('score').textContent = score; }
function updateProgress() { document.getElementById('wordCount').textContent = (currentWordIndex + 1) + '/' + words.length; document.getElementById('progressBar').style.width = ((currentWordIndex + 1) / words.length * 100) + '%'; }
function updateTimer() { var e = document.getElementById('timer'); e.textContent = timeLeft; e.classList.toggle('urgent', gameMode === 'hell' ? timeLeft <= 20 : (gameMode === 'mario' ? timeLeft <= 15 : timeLeft <= 30)); }
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(function () {
    timeLeft--; updateTimer();
    if (gameMode === 'hell' || gameMode === 'mario') updateBGM();
    if (gameMode === 'hell' && timeLeft <= 10 && timeLeft > 0) { var f = document.createElement('div'); f.className = 'screen-flash'; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 500); }
    if (gameMode === 'mario' && timeLeft <= 10 && timeLeft > 0) { var f = document.createElement('div'); f.className = 'screen-flash'; f.style.background = 'rgba(251,208,0,0.3)'; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 500); }
    if (timeLeft <= 0) endGame();
  }, 1000);
}
function spawnCoin(ti) {
  var boxes = document.querySelectorAll('.letter-box'), tb = boxes[ti]; if (!tb) return;
  var r = tb.getBoundingClientRect(), coin = document.createElement('div');
  coin.className = 'coin-spin'; coin.textContent = '\ud83e\ude99'; coin.style.left = r.left + r.width / 2 - 16 + 'px'; coin.style.top = r.top + 'px'; document.body.appendChild(coin); setTimeout(function () { coin.remove(); }, 800);
}

// === END + LEADERBOARD ===
function endGame() {
  clearInterval(timerInterval); stopBGM();
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  var endTitles = { hell: '\ud83d\udc80 Challenge Over!', mario: '\ud83c\udf44 Challenge Over!', normal: '\ud83c\udf89 Challenge Over!' };
  document.getElementById('endTitle').textContent = endTitles[gameMode];
  document.getElementById('finalScore').textContent = score; playGameOver();
  var rt = '';
  if (gameMode === 'hell') rt = score >= 300 ? '\ud83d\udc51 Hell King!' : (score >= 150 ? '\ud83d\udd25 Survived!' : (score >= 0 ? '\ud83d\udcaa Barely...' : '\ud83d\udc80 Consumed'));
  else if (gameMode === 'mario') rt = score >= 120 ? '\u2b50 Super Quickdraw!' : (score >= 80 ? '\ud83c\udf44 Powered Up!' : (score >= 0 ? '\ud83c\udf1f Not bad' : '\ud83d\udc22 Tripped'));
  else rt = score >= 200 ? '\ud83c\udfc6 Word Master!' : (score >= 100 ? '\ud83d\udc4d Nice!' : (score >= 0 ? '\ud83d\udcaa Keep going' : '\ud83d\udcda Study more'));
  document.getElementById('resultText').textContent = rt;
  var name = playerData.name.trim();
  var listKey = getListKey();
  if (name) { addToLB(gameMode, listKey, { name: name, score: score, avatar: playerData.avatar, date: new Date().toISOString().slice(0, 10) }); }
  renderLeaderboard();
  document.getElementById('wordList').innerHTML = words.map(function (w, i) {
    var r = gameResults.find(function (g) { return g.word === w.word; });
    return '<div class="word-item"><span>' + (i + 1) + '. ' + w.word + ' <small>(' + w.meaning + ')</small></span>' + (r ? '<span class="correct">\u2713</span>' : '<span class="wrong">\u2717</span>') + '</div>';
  }).join('');
}

function renderLeaderboard() {
  var lb = loadLB(gameMode, getListKey()), c = document.getElementById('lbContent');
  var modeNames = { hell: 'Hell', mario: 'Quickdraw', normal: 'Normal' };
  document.getElementById('lbTitle').textContent = '\ud83c\udfc6 Leaderboard \u00b7 ' + modeNames[gameMode] + ' Mode';
  if (lb.length === 0) { c.innerHTML = '<div class="lb-empty">No scores yet<br>Finish a game to be the first!</div>'; return; }
  var myName = playerData.name.trim();
  c.innerHTML = '<table class="lb-table"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Date</th></tr></thead><tbody>' + lb.map(function (e, i) { return '<tr' + (myName && e.name === myName ? ' class="lb-my-row"' : '') + '><td class="lb-rank">' + (i + 1) + '</td><td><span class="lb-avatar" id="lbav_' + i + '"></span><span class="lb-player">' + e.name + '</span></td><td class="lb-score">' + e.score + '</td><td style="font-size:11px">' + e.date + '</td></tr>'; }).join('') + '</tbody></table>';
  lb.forEach(function (e, i) { var av = ALL_AVATARS[e.avatar] || ALL_AVATARS[0]; renderPixelAvatar(document.getElementById('lbav_' + i), av, 28); });
}

function restartGame() { startGame(); }

// === EVENTS ===
document.addEventListener('keydown', function (e) {
  if (document.getElementById('gameScreen').style.display === 'none') return;
  if (/^[A-Za-z]$/.test(e.key)) { e.preventDefault(); handleInput(e.key.toUpperCase()); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && document.getElementById('playerScreen').style.display !== 'none') startGame();
});

// === INIT ===
generateKeyboard();
showVocabScreen();
</script>
