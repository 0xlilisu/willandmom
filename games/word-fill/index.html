<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填字母挑战 - Word Fill Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: white;
            --text: #333;
            --sub: #666;
            --stat-bg: #f5f5f5;
            --stat-color: #667eea;
            --border: #ddd;
            --missing-border: #3498db;
            --missing-bg: #eaf2f8;
            --missing-color: #3498db;
            --filled-border: #27ae60;
            --filled-bg: #d5f5e3;
            --filled-color: #27ae60;
            --key-left-bg: #5b9bd5;
            --key-left-hover: #4a8ac4;
            --key-right-bg: #9b59b6;
            --key-right-hover: #8e44ad;
            --progress-bg: #eee;
            --progress-fill: linear-gradient(90deg, #667eea, #764ba2);
            --btn-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-shadow: rgba(102, 126, 234, 0.4);
            --msg-success-bg: #d5f5e3;
            --msg-success-color: #27ae60;
            --msg-error-bg: #fadbd8;
            --msg-error-color: #e74c3c;
            --h-shadow: 0 20px 60px rgba(0,0,0,0.3);
            --glow: none;
            --particle: none;
        }

        body.hell {
            --bg: #0a0a0a;
            --container-bg: #1a1a2e;
            --text: #ff6b6b;
            --sub: #f39c12;
            --stat-bg: #16213e;
            --stat-color: #e74c3c;
            --border: #e74c3c;
            --missing-border: #ff6b6b;
            --missing-bg: #2d132c;
            --missing-color: #ff6b6b;
            --filled-border: #f39c12;
            --filled-bg: #2d1b00;
            --filled-color: #f39c12;
            --key-left-bg: #c0392b;
            --key-left-hover: #a93226;
            --key-right-bg: #e67e22;
            --key-right-hover: #d35400;
            --progress-bg: #16213e;
            --progress-fill: linear-gradient(90deg, #ff6b6b, #ff4444, #ff6b6b);
            --btn-bg: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            --btn-shadow: rgba(231, 76, 60, 0.5);
            --msg-success-bg: #2d1b00;
            --msg-success-color: #f39c12;
            --msg-error-bg: #2d132c;
            --msg-error-color: #ff4444;
            --h-shadow: 0 0 40px rgba(255, 68, 68, 0.3), 0 20px 60px rgba(0,0,0,0.6);
            --glow: 0 0 20px rgba(255, 68, 68, 0.4);
            --particle: block;
        }

        /* 马里奥模式 */
        body.mario {
            --bg: linear-gradient(180deg, #5c94fc 0%, #4a7de0 40%, #b8d4ff 100%);
            --container-bg: #fffef5;
            --text: #e52521;
            --sub: #8b4513;
            --stat-bg: #fff8e1;
            --stat-color: #e52521;
            --border: #e52521;
            --missing-border: #fbd000;
            --missing-bg: #fff8e1;
            --missing-color: #8b4513;
            --filled-border: #43b047;
            --filled-bg: #e8f5e9;
            --filled-color: #43b047;
            --key-left-bg: #e52521;
            --key-left-hover: #c41e1a;
            --key-right-bg: #43b047;
            --key-right-hover: #388e3c;
            --progress-bg: #e0e0e0;
            --progress-fill: linear-gradient(90deg, #fbd000, #e52521);
            --btn-bg: linear-gradient(135deg, #e52521 0%, #43b047 100%);
            --btn-shadow: rgba(229, 37, 33, 0.4);
            --msg-success-bg: #c8e6c9;
            --msg-success-color: #2e7d32;
            --msg-error-bg: #ffcdd2;
            --msg-error-color: #c62828;
            --h-shadow: 0 8px 0 #8b4513, 0 20px 60px rgba(0,0,0,0.2);
            --glow: 0 0 15px rgba(251, 208, 0, 0.5);
            --particle: none;
        }

        /* 马里奥风格特殊样式 */
        body.mario .game-container {
            border: 4px solid #8b4513;
            border-radius: 8px;
            box-shadow: 0 8px 0 #8b4513, 0 12px 30px rgba(0,0,0,0.2);
        }

        body.mario .letter-box {
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            border-width: 3px;
        }

        body.mario .letter-box.missing {
            background: #fbd000;
            border-color: #8b4513;
            color: #8b4513;
            animation: marioBounce 0.6s ease-in-out infinite;
        }

        @keyframes marioBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
            50% { transform: translateY(0); }
            70% { transform: translateY(-3px); }
        }

        body.mario .key {
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }

        body.mario .key:hover {
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }

        body.mario .key:active {
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
            transform: translateY(2px) scale(0.95);
        }

        body.mario .btn {
            border-radius: 4px;
            box-shadow: 0 4px 0 #8b4513;
        }

        body.mario .btn:hover {
            box-shadow: 0 6px 0 #8b4513;
            transform: translateY(-2px);
        }

        body.mario .btn:active {
            box-shadow: 0 2px 0 #8b4513;
            transform: translateY(2px);
        }

        body.mario .stats-bar {
            border: 2px solid #fbd000;
            border-radius: 4px;
        }

        body.mario .mode-card.mario-card {
            border-color: #e52521;
            background: #fffef5;
            box-shadow: 0 4px 0 #8b4513;
        }
        body.mario .mode-card.mario-card:hover {
            border-color: #fbd000;
            box-shadow: 0 8px 0 #8b4513, 0 10px 30px rgba(229,37,33,0.3);
        }

        /* 马里奥模式下BPM显示 */
        body.mario .bpm-display {
            display: block;
            color: #43b047;
        }

        /* 金币动画 */
        .coin-spin {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 32px;
            animation: coinFly 0.8s ease-out forwards;
        }
        @keyframes coinFly {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            30% { opacity: 1; transform: translateY(-40px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        /* 地狱火焰粒子 */
        .flame-particles {
            display: var(--particle);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .flame {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            animation: rise linear infinite;
            opacity: 0;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        .game-container {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--h-shadow);
            max-width: 650px;
            width: 100%;
            position: relative;
            z-index: 1;
            transition: all 0.5s ease;
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 10px;
            font-size: 28px;
            transition: color 0.5s;
        }

        .subtitle {
            text-align: center;
            color: var(--sub);
            margin-bottom: 20px;
            font-size: 14px;
            transition: color 0.5s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--stat-bg);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: background 0.5s;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--stat-color);
            transition: color 0.5s;
        }

        .stat-label {
            font-size: 12px;
            color: var(--sub);
            margin-top: 5px;
            transition: color 0.5s;
        }

        .timer.urgent {
            color: #ff4444;
            animation: pulse 0.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: none; }
            50% { transform: scale(1.2); text-shadow: 0 0 20px #ff4444; }
        }

        .word-display {
            text-align: center;
            margin: 20px 0;
        }

        .word-meaning {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text);
            transition: color 0.5s;
        }

        .word-meaning .meaning-label {
            font-size: 13px;
            opacity: 0.6;
        }

        .word-number {
            color: var(--sub);
            font-size: 13px;
            margin-bottom: 8px;
            transition: color 0.5s;
        }

        .word-boxes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .letter-box {
            width: 44px;
            height: 55px;
            border: 3px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            transition: all 0.3s ease;
            background: var(--container-bg);
            color: var(--text);
            position: relative;
        }

        .letter-box.revealed {
            background: var(--stat-bg);
            border-color: var(--stat-color);
        }

        .letter-box.missing {
            border-color: var(--missing-border);
            background: var(--missing-bg);
            color: var(--missing-color);
            cursor: pointer;
            box-shadow: var(--glow);
            animation: missingPulse 2s ease-in-out infinite;
        }

        @keyframes missingPulse {
            0%, 100% { box-shadow: var(--glow); }
            50% { box-shadow: 0 0 30px rgba(255, 107, 107, 0.6); }
        }

        .letter-box.missing:hover {
            transform: scale(1.1);
        }

        .letter-box.filled {
            border-color: var(--filled-border);
            background: var(--filled-bg);
            color: var(--filled-color);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .letter-box.wrong {
            border-color: #ff4444;
            background: #2d132c;
            color: #ff4444;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-6px) rotate(-3deg); }
            30% { transform: translateX(6px) rotate(3deg); }
            45% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        .hint-text {
            text-align: center;
            color: var(--sub);
            margin: 12px 0;
            font-size: 13px;
            transition: color 0.5s;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .key {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .key.key-left {
            background: var(--key-left-bg);
        }
        .key.key-left:hover {
            background: var(--key-left-hover);
            transform: translateY(-2px);
        }

        .key.key-right {
            background: var(--key-right-bg);
        }
        .key.key-right:hover {
            background: var(--key-right-hover);
            transform: translateY(-2px);
        }

        .key:active {
            transform: translateY(0) scale(0.95);
        }

        .key:disabled {
            background: #555 !important;
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* 键盘分隔线 */
        .key-divider {
            width: 4px;
            height: 42px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            margin: 0 2px;
        }

        /* 键盘图例 */
        .key-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
            font-size: 11px;
            color: var(--sub);
        }
        .key-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            display: inline-block;
        }
        .legend-dot.left-dot { background: var(--key-left-bg); }
        .legend-dot.right-dot { background: var(--key-right-bg); }

        .message {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin: 12px 0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            background: var(--msg-success-bg);
            color: var(--msg-success-color);
        }

        .message.error {
            background: var(--msg-error-bg);
            color: var(--msg-error-color);
        }

        .btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 17px;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--btn-shadow);
        }

        .btn-sm {
            padding: 10px 24px;
            font-size: 14px;
        }

        .word-list {
            text-align: left;
            background: var(--stat-bg);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            max-height: 180px;
            overflow-y: auto;
            transition: background 0.5s;
        }

        .word-item {
            padding: 7px 0;
            border-bottom: 1px solid rgba(128,128,128,0.2);
            display: flex;
            justify-content: space-between;
            color: var(--sub);
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        .final-score {
            font-size: 48px;
            color: var(--stat-color);
            font-weight: bold;
            margin: 20px 0;
            transition: color 0.5s;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
            transition: background 0.5s;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            transition: width 0.3s;
        }

        /* 模式选择卡 */
        .mode-cards {
            display: flex;
            gap: 20px;
            margin: 25px 0;
            justify-content: center;
        }

        .mode-card {
            flex: 1;
            padding: 25px 15px;
            border-radius: 16px;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: #fafafa;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .mode-card.normal-card {
            border-color: #667eea;
        }
        .mode-card.normal-card:hover {
            border-color: #5a67d8;
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
        }

        .mode-card.hell-card {
            border-color: #e74c3c;
            background: #1a1a2e;
            color: #ff6b6b;
        }
        .mode-card.hell-card:hover {
            border-color: #ff4444;
            box-shadow: 0 10px 30px rgba(231,76,60,0.4);
        }

        .mode-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .mode-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .mode-desc {
            font-size: 13px;
            opacity: 0.7;
        }

        /* 倒计时警告叠加层 */
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.15);
            pointer-events: none;
            z-index: 0;
            animation: flashIn 0.5s ease-out;
            opacity: 0;
        }

        @keyframes flashIn {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* BPM显示 */
        .bpm-display {
            display: none;
            text-align: center;
            font-size: 11px;
            color: #ff6b6b;
            margin-top: 5px;
            opacity: 0.6;
        }
        body.hell .bpm-display {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 火焰粒子 -->
    <div class="flame-particles" id="flameParticles"></div>

    <div class="game-container">
        <!-- 模式选择 -->
        <div id="modeScreen">
            <h1>🎮 填字母挑战</h1>
            <p class="subtitle">List 27 单词练习 · 选择一个模式开始</p>
            
            <div class="mode-cards">
                <div class="mode-card normal-card" onclick="selectMode('normal')">
                    <div class="mode-icon">📖</div>
                    <div class="mode-name">普通模式</div>
                    <div class="mode-desc">约60%字母可见<br>限时120秒<br>猜对+10 / 猜错-5</div>
                </div>
                <div class="mode-card hell-card" onclick="selectMode('hell')">
                    <div class="mode-icon">🔥</div>
                    <div class="mode-name">地狱模式</div>
                    <div class="mode-desc">仅1-2个字母提示<br>限时90秒<br>猜对+20 / 猜错-15<br>背景音乐加速！</div>
                </div>
                <div class="mode-card mario-card" onclick="selectMode('mario')">
                    <div class="mode-icon">🍄</div>
                    <div class="mode-name">快枪手模式</div>
                    <div class="mode-desc">60%字母可见<br>⏱ 限时60秒<br>猜对+15 / 猜错-10<br>马里奥音效配乐！</div>
                </div>
            </div>
        </div>

        <!-- 开始界面（模式确认） -->
        <div id="startScreen" class="start-screen" style="display: none;">
            <h1 id="startTitle">填字母挑战</h1>
            <p class="subtitle" id="startSubtitle"></p>
            <div style="margin: 20px 0; color: var(--sub);" id="startRules"></div>
            <button class="btn" onclick="startGame()">开始挑战</button>
            <button class="btn btn-sm" onclick="showModeSelect()" style="background: #888;">返回选择</button>
        </div>

        <!-- 游戏界面 -->
        <div id="gameScreen" style="display: none;">
            <h1 id="gameTitle">填字母挑战</h1>
            
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="score">0</div>
                    <div class="stat-label">得分</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="wordCount">1/10</div>
                    <div class="stat-label">进度</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="timer">120</div>
                    <div class="stat-label">剩余时间</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 10%"></div>
            </div>
            <div class="bpm-display" id="bpmDisplay">BPM: --</div>

            <div class="word-display">
                <div class="word-meaning" id="wordMeaning"></div>
                <div class="word-number">单词 <span id="currentNum">1</span> / <span id="totalWords">10</span></div>
                <div class="word-boxes" id="wordBoxes"></div>
            </div>

            <p class="hint-text" id="hintText">💡 点击空格或按键盘输入缺失的字母</p>

            <div id="message" class="message"></div>

            <div class="keyboard" id="keyboard"></div>
            <div class="key-legend" id="keyLegend">
                <span><span class="legend-dot left-dot"></span> 左手区</span>
                <span><span class="legend-dot right-dot"></span> 右手区</span>
            </div>
            <button class="btn btn-sm" onclick="endGame()" style="margin-top: 15px; background: #888;">结束挑战</button>
        </div>

        <!-- 结束界面 -->
        <div id="endScreen" class="end-screen" style="display: none;">
            <h1 id="endTitle">🎉 挑战结束！</h1>
            <div class="final-score" id="finalScore">0</div>
            <p id="resultText" style="color: var(--sub); margin-bottom: 20px;"></p>
            
            <div class="word-list" id="wordList"></div>
            
            <button class="btn" onclick="restartGame()">再来一次</button>
            <button class="btn btn-sm" onclick="showModeSelect()" style="background: #888;">换模式</button>
        </div>
    </div>

    <script>
        // ==================== 单词数据 ====================
        const words = [
            { word: 'CHEMIST', meaning: '化学家' },
            { word: 'SCHEME', meaning: '计划，方案' },
            { word: 'SCHOOL', meaning: '学校' },
            { word: 'CHARACTER', meaning: '性格，角色' },
            { word: 'ARCHITECT', meaning: '建筑师' },
            { word: 'STOMACH', meaning: '胃' },
            { word: 'CHORUS', meaning: '合唱' },
            { word: 'ECHO', meaning: '回声' },
            { word: 'TECHNOLOGY', meaning: '科技' },
            { word: 'CHAOS', meaning: '混乱' }
        ];

        // ==================== 游戏状态 ====================
        let gameMode = 'normal'; // 'normal' | 'hell' | 'mario'
        let currentWordIndex = 0;
        let score = 0;
        let timeLeft;
        let timerInterval;
        let currentWord = null;
        let missingIndices = [];
        let filledIndices = new Set();
        let gameResults = [];

        // ==================== Web Audio API 音频系统 ====================
        let audioCtx = null;
        let bgmInterval = null;
        let bgmGain = null;
        let currentBPM = 120;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgmGain = audioCtx.createGain();
                bgmGain.gain.value = 0.12;
                bgmGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 正确音效 - 清脆的叮声
        function playCorrectSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // 主音 - 高音叮
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(880, now);
            osc1.frequency.setValueAtTime(1100, now + 0.05);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            // 和声
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1320, now + 0.06);
            gain2.gain.setValueAtTime(0.2, now + 0.06);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.06);
            osc2.stop(now + 0.4);
        }

        // 错误音效 - 低沉的蜂鸣
        function playWrongSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // 单词完成音效 - 胜利
        function playWordCompleteSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const t = now + i * 0.1;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.25);
            });
        }

        // 游戏结束音效
        function playGameOverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [440, 415, 392, 349, 330]; // 下行
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                const t = now + i * 0.2;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.35);
            });
        }

        // 马里奥风格音效
        function playMarioCoin() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // 金币叮叮声 - 高音快速两个音
            [988, 1319].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                const t = now + i * 0.07;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.12);
            });
        }

        function playMarioBump() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function playMarioPowerUp() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // 快速上行音阶 - 类似吃蘑菇
            const notes = [523, 659, 784, 1047, 1319, 1568];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                const t = now + i * 0.05;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.1);
            });
        }

        function playMarioGameOver() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // 马里奥死亡音效 - 下行
            [659, 587, 523, 392, 330, 262].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                const t = now + i * 0.12;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.2);
            });
        }

        // 背景音乐 - 心跳式节拍（用心跳声模拟）
        // BPM随时间加速
        function startBGM(totalTime) {
            stopBGM();
            if (!audioCtx) return;
            
            if (gameMode === 'mario') {
                startMarioBGM(totalTime);
                return;
            }
            
            currentBPM = totalTime <= 90 ? 100 : 80;
            let lastBeatTime = 0;
            
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state === 'suspended') return;
                
                const now = audioCtx.currentTime;
                if (now - lastBeatTime < 0.05) return;
                lastBeatTime = now;
                
                // 计算当前BPM（线性插值：时间越少BPM越高）
                const total = gameMode === 'hell' ? 90 : 120;
                const ratio = (total - timeLeft) / total;
                const minBPM = total <= 90 ? 100 : 80;
                const maxBPM = total <= 90 ? 220 : 180;
                currentBPM = minBPM + ratio * (maxBPM - minBPM);
                
                document.getElementById('bpmDisplay').textContent = '🔥 BPM: ' + Math.round(currentBPM);
                
                // 低频心跳
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(55, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(bgmGain);
                osc.start(now);
                osc.stop(now + 0.15);
                
                // 高频轻敲（模拟hi-hat）
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                const noise = audioCtx.createBufferSource();
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 8000;
                
                gain2.gain.setValueAtTime(0.08, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                noise.connect(filter);
                filter.connect(gain2);
                gain2.connect(bgmGain);
                noise.start(now);
                noise.stop(now + 0.05);
                
            }, () => 60000 / currentBPM);
        }

        // 马里奥BGM - 欢快跳跃旋律
        let marioBGMNoteIdx = 0;
        function startMarioBGM(totalTime) {
            // 马里奥风格旋律音符序列（C大调）
            const melody = [
                523, 659, 784, 1047,  // C5 E5 G5 C6 (上升)
                784, 1047, 1319,       // G5 C6 E6
                1047, 784, 659, 523,   // C6 G5 E5 C5 (下降)
                659, 523, 392, 523,    // E5 C5 G4 C5
            ];
            
            currentBPM = 140; // 马里奥风格较快
            marioBGMNoteIdx = 0;
            
            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state === 'suspended') return;
                
                const now = audioCtx.currentTime;
                const total = 60; // 快枪手60秒
                const ratio = (total - timeLeft) / total;
                currentBPM = 140 + ratio * 80; // BPM 140→220
                
                document.getElementById('bpmDisplay').textContent = '🍄 BPM: ' + Math.round(currentBPM);
                
                // 播放旋律音符
                const freq = melody[marioBGMNoteIdx % melody.length];
                marioBGMNoteIdx++;
                
                // 主旋律 - square波（8-bit风格）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(bgmGain);
                osc.start(now);
                osc.stop(now + 0.1);
                
                // 低音鼓点
                if (marioBGMNoteIdx % 4 === 0) {
                    const kick = audioCtx.createOscillator();
                    const kickGain = audioCtx.createGain();
                    kick.type = 'sine';
                    kick.frequency.setValueAtTime(80, now);
                    kick.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                    kickGain.gain.setValueAtTime(0.2, now);
                    kickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    kick.connect(kickGain);
                    kickGain.connect(bgmGain);
                    kick.start(now);
                    kick.stop(now + 0.12);
                }
                
                // 每8拍加一个小高音点缀
                if (marioBGMNoteIdx % 8 === 0) {
                    const ding = audioCtx.createOscillator();
                    const dingGain = audioCtx.createGain();
                    ding.type = 'sine';
                    ding.frequency.setValueAtTime(1568, now);
                    dingGain.gain.setValueAtTime(0.05, now);
                    dingGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    ding.connect(dingGain);
                    dingGain.connect(bgmGain);
                    ding.start(now);
                    ding.stop(now + 0.08);
                }
                
            }, () => 60000 / currentBPM);
        }

        function updateBGMInterval() {
            if (!bgmInterval) return;
            if (gameMode === 'mario') return;
            const total = gameMode === 'hell' ? 90 : 120;
            const ratio = (total - timeLeft) / total;
            const minBPM = total <= 90 ? 100 : 80;
            const maxBPM = total <= 90 ? 220 : 180;
            currentBPM = minBPM + ratio * (maxBPM - minBPM);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
            document.getElementById('bpmDisplay').textContent = 'BPM: --';
        }

        // ==================== 火焰粒子 ====================
        function createFlameParticles() {
            const container = document.getElementById('flameParticles');
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const flame = document.createElement('div');
                flame.className = 'flame';

                flame.style.width = size + 'px';
                flame.style.height = size + 'px';
                flame.style.left = Math.random() * 100 + '%';
                flame.style.background = Math.random() > 0.5 
                    ? `hsl(${Math.random() * 30 + 10}, 100%, ${Math.random() * 30 + 40}%)`
                    : `hsl(${Math.random() * 15}, 100%, ${Math.random() * 20 + 50}%)`;
                flame.style.animationDuration = (Math.random() * 4 + 3) + 's';
                flame.style.animationDelay = Math.random() * 4 + 's';
                container.appendChild(flame);
            }
        }

        function showModeSelect() {
            stopBGM();
            clearInterval(timerInterval);
            document.getElementById('modeScreen').style.display = 'block';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('endScreen').style.display = 'none';
            document.body.classList.remove('hell', 'mario');
            document.getElementById('flameParticles').innerHTML = '';
        }

        // ==================== 键盘生成（QWERTY + 左右手分区） ====================
        // 左右手分区定义
        const leftHandKeys = new Set(['Q','W','E','R','T','A','S','D','F','G','Z','X','C','V','B']);
        const rightHandKeys = new Set(['Y','U','I','O','P','H','J','K','L','N','M']);

        function generateKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';

            // QWERTY 三行布局
            const rows = [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['Z','X','C','V','B','N','M']
            ];

            rows.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach((letter, colIndex) => {
                    // 在 T/Y 和 G/H 和 B/N 之间插入分隔线
                    const isLeft = leftHandKeys.has(letter);
                    const isSplitPoint = (rowIndex === 0 && letter === 'Y') ||
                                         (rowIndex === 1 && letter === 'H') ||
                                         (rowIndex === 2 && letter === 'N');

                    if (isSplitPoint) {
                        const divider = document.createElement('div');
                        divider.className = 'key-divider';
                        rowDiv.appendChild(divider);
                    }

                    const btn = document.createElement('button');
                    btn.className = 'key ' + (isLeft ? 'key-left' : 'key-right');
                    btn.textContent = letter;
                    btn.onclick = () => handleInput(letter);
                    rowDiv.appendChild(btn);
                });

                keyboard.appendChild(rowDiv);
            });
        }

        // ==================== 开始游戏 ====================
        function startGame() {
            document.getElementById('modeScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('endScreen').style.display = 'none';
            
            currentWordIndex = 0;
            score = 0;
            timeLeft = gameMode === 'hell' ? 90 : (gameMode === 'mario' ? 60 : 120);
            gameResults = [];
            
            document.getElementById('gameTitle').textContent = gameMode === 'hell' ? '🔥 地狱模式' : (gameMode === 'mario' ? '🍄 快枪手模式' : '📖 填字母挑战');
            document.getElementById('hintText').textContent = gameMode === 'hell' 
                ? '💀 看中文释义猜单词！点击空格或按键盘输入' 
                : (gameMode === 'mario' ? '🍄 快来收集金币！点击空格或按键盘输入' : '💡 点击空格或按键盘输入缺失的字母');
            document.getElementById('totalWords').textContent = words.length;
            
            updateScore();
            updateTimer();
            generateKeyboard();
            loadWord();
            startTimer();
            
            if (gameMode === 'hell') {
                startBGM(90);
            } else if (gameMode === 'mario') {
                startBGM(60);
            }
            
            initAudio();
        }

        // ==================== 单词加载 ====================
        function loadWord() {
            if (currentWordIndex >= words.length) {
                endGame();
                return;
            }

            currentWord = words[currentWordIndex];
            const word = currentWord.word;
            const wordLength = word.length;
            
            missingIndices = [];
            filledIndices.clear();
            
            if (gameMode === 'hell') {
                // 地狱模式：只显示1-2个字母
                const numRevealed = wordLength <= 6 ? 1 : 2;
                const allIndices = Array.from({length: wordLength}, (_, i) => i);
                // 随机洗牌
                for (let i = allIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
                }
                const revealedIndices = new Set(allIndices.slice(0, numRevealed));
                // 所有未显示的字母都算missing
                for (let i = 0; i < wordLength; i++) {
                    if (!revealedIndices.has(i)) {
                        missingIndices.push(i);
                    }
                }
            } else {
                // 普通模式：隐藏约40%字母
                const numToHide = Math.max(2, Math.floor(wordLength * 0.4));
                const allIndices = Array.from({length: wordLength}, (_, i) => i);
                for (let i = allIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allIndices[i], allIndices[j]] = [allIndices[j], allIndices[i]];
                }
                missingIndices = allIndices.slice(0, numToHide).sort((a, b) => a - b);
            }

            renderWord();
            updateProgress();
        }

        // ==================== 渲染 ====================
        function renderWord() {
            const container = document.getElementById('wordBoxes');
            container.innerHTML = '';
            
            const word = currentWord.word;
            const isHell = gameMode === 'hell';
            
            for (let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                
                if (missingIndices.includes(i)) {
                    if (filledIndices.has(i)) {
                        box.classList.add('filled');
                        box.textContent = word[i];
                    } else {
                        box.classList.add('missing');
                        box.textContent = '?';
                    }
                } else {
                    box.classList.add('revealed');
                    box.textContent = word[i];
                }
                
                container.appendChild(box);
            }
            
            document.getElementById('currentNum').textContent = currentWordIndex + 1;
            
            // 显示中文释义
            const meaningEl = document.getElementById('wordMeaning');
            if (isHell) {
                meaningEl.innerHTML = `<span class="meaning-label">🔍 中文释义：</span>${currentWord.meaning}`;
            } else {
                meaningEl.innerHTML = '';
            }
        }

        // ==================== 输入处理 ====================
        function handleInput(letter) {
            if (!currentWord || timeLeft <= 0) return;
            
            // 找到第一个未填的空位
            let targetIndex = -1;
            for (let idx of missingIndices) {
                if (!filledIndices.has(idx)) {
                    targetIndex = idx;
                    break;
                }
            }
            
            if (targetIndex === -1) return;
            
            const correctLetter = currentWord.word[targetIndex];
            
            if (letter === correctLetter) {
                filledIndices.add(targetIndex);
                const points = gameMode === 'hell' ? 20 : (gameMode === 'mario' ? 15 : 10);
                score += points;
                
                if (gameMode === 'mario') {
                    playMarioCoin();
                    spawnCoin(targetIndex);
                } else {
                    playCorrectSound();
                }
                showMessage(`✅ 正确！+${points}分`, 'success');
                renderWord();
                updateScore();
                
                if (filledIndices.size === missingIndices.length) {
                    gameResults.push({ word: currentWord.word, meaning: currentWord.meaning, correct: true });
                    if (gameMode === 'mario') {
                        playMarioPowerUp();
                    } else {
                        playWordCompleteSound();
                    }
                    setTimeout(() => {
                        currentWordIndex++;
                        loadWord();
                    }, 600);
                }
            } else {
                const penalty = gameMode === 'hell' ? 15 : (gameMode === 'mario' ? 10 : 5);
                score -= penalty;
                playWrongSound();
                showMessage(`❌ 错误！正确答案是 ${correctLetter}，-${penalty}分`, 'error');
                updateScore();
                if (gameMode === 'mario') {
                    playMarioBump();
                } else {
                    playWrongSound();
                }
                
                // 视觉反馈
                const boxes = document.querySelectorAll('.letter-box.missing');
                boxes.forEach(box => {
                    if (box.textContent === '?') {
                        box.classList.add('wrong');
                        setTimeout(() => box.classList.remove('wrong'), 400);
                    }
                });
                
                // 地狱模式屏幕震动 / 马里奥模式弹跳
                if (gameMode === 'hell') {
                    document.body.style.transform = 'translateX(3px)';
                    setTimeout(() => document.body.style.transform = 'translateX(-3px)', 50);
                    setTimeout(() => document.body.style.transform = 'translateX(2px)', 100);
                    setTimeout(() => document.body.style.transform = 'translateX(0)', 150);
                } else if (gameMode === 'mario') {
                    const game = document.querySelector('.game-container');
                    game.style.transform = 'translateY(-5px)';
                    setTimeout(() => game.style.transform = 'translateY(0)', 100);
                    setTimeout(() => game.style.transform = 'translateY(-3px)', 200);
                    setTimeout(() => game.style.transform = 'translateY(0)', 300);
                }
            }
        }

        // ==================== UI更新 ====================
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message show ' + type;
            setTimeout(() => {
                msg.classList.remove('show');
            }, 1500);
        }

        // 马里奥金币飘出动画
        function spawnCoin(targetIndex) {
            const boxes = document.querySelectorAll('.letter-box');
            const targetBox = boxes[targetIndex];
            if (!targetBox) return;
            
            const rect = targetBox.getBoundingClientRect();
            const coin = document.createElement('div');
            coin.className = 'coin-spin';
            coin.textContent = '🪙';
            coin.style.left = rect.left + rect.width / 2 - 16 + 'px';
            coin.style.top = rect.top + 'px';
            document.body.appendChild(coin);
            setTimeout(() => coin.remove(), 800);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function updateProgress() {
            document.getElementById('wordCount').textContent = `${currentWordIndex + 1}/${words.length}`;
            const progress = ((currentWordIndex + 1) / words.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function updateTimer() {
            const timerEl = document.getElementById('timer');
            timerEl.textContent = timeLeft;
            const isUrgent = gameMode === 'hell' ? timeLeft <= 20 : (gameMode === 'mario' ? timeLeft <= 15 : timeLeft <= 30);
            
            if (isUrgent) {
                timerEl.classList.add('urgent');
            } else {
                timerEl.classList.remove('urgent');
            }
        }

        // ==================== 计时器 ====================
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                
                if (gameMode === 'hell' || gameMode === 'mario') {
                    updateBGMInterval();
                }
                if (gameMode === 'hell') {
                    // 最后10秒屏幕闪红
                    if (timeLeft <= 10 && timeLeft > 0) {
                        const flash = document.createElement('div');
                        flash.className = 'screen-flash';
                        document.body.appendChild(flash);
                        setTimeout(() => flash.remove(), 500);
                    }
                }
                if (gameMode === 'mario' && timeLeft <= 10 && timeLeft > 0) {
                    const flash = document.createElement('div');
                    flash.className = 'screen-flash';
                    flash.style.background = 'rgba(251, 208, 0, 0.3)';
                    document.body.appendChild(flash);
                    setTimeout(() => flash.remove(), 500);
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // ==================== 结束游戏 ====================
        function endGame() {
            clearInterval(timerInterval);
            stopBGM();
            
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            
            document.getElementById('endTitle').textContent = gameMode === 'hell' ? '💀 地狱挑战结束！' : (gameMode === 'mario' ? '🍄 快枪手挑战结束！' : '🎉 挑战结束！');
            document.getElementById('finalScore').textContent = score;
            
            if (gameMode === 'mario') {
                playMarioGameOver();
            } else {
                playGameOverSound();
            }
            
            let resultText = '';
            if (gameMode === 'hell') {
                if (score >= 300) resultText = '👑 地狱之王！你是单词疯子！';
                else if (score >= 150) resultText = '🔥 浴火重生！地狱难不倒你！';
                else if (score >= 0) resultText = '💪 地狱中幸存，继续修炼吧！';
                else resultText = '💀 被地狱吞噬了...再来一次！';
            } else if (gameMode === 'mario') {
                if (score >= 120) resultText = '⭐ 超级快枪手！你就是单词马里奥！';
                else if (score >= 80) resultText = '🍄 吃了蘑菇变大了！继续前进！';
                else if (score >= 0) resultText = '🌟 不错的速度！还能更快哦~';
                else resultText = '🐢 被乌龟壳绊倒了...再来一局！';
            } else {
                if (score >= 200) resultText = '🏆 太厉害了！单词大师！';
                else if (score >= 100) resultText = '👍 不错哦！继续保持！';
                else if (score >= 0) resultText = '💪 还可以，再练习一下吧！';
                else resultText = '📚 加油！多背单词哦！';
            }
            document.getElementById('resultText').textContent = resultText;
            
            const listHtml = words.map((w, i) => {
                const result = gameResults.find(r => r.word === w.word);
                const status = result 
                    ? '<span class="correct">✓ 完成</span>' 
                    : '<span class="wrong">✗ 未完成</span>';
                return `<div class="word-item">
                    <span>${i+1}. ${w.word} <small>(${w.meaning})</small></span>${status}
                </div>`;
            }).join('');
            document.getElementById('wordList').innerHTML = listHtml;
        }

        function restartGame() {
            startGame();
        }

        // ==================== 键盘事件 ====================
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('gameScreen').style.display === 'none') return;
            
            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
                e.preventDefault();
                handleInput(key);
            }
        });

        // ==================== 初始化 ====================
        generateKeyboard();
    </script>
</body>
</html>
